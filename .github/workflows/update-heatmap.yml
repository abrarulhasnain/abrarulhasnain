name: Update contribution heatmap SVG

on:
  schedule:
    # Runs once a day at 05:30 UTC. Change the cron expression if you want
    # a different time — https://crontab.guru is handy for that.
    - cron: "30 5 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate heatmap SVG
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_PATH: dist/heatmap.svg
        run: node scripts/generate-heatmap.mjs

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contribution heatmap SVG"
          file_pattern: dist/heatmap.svg
